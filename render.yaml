services:
  - type: web
    name: farmart-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: ALLOWED_ORIGINS
        value: https://farmart-com.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: farmart-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES
        value: "3600"

databases:
  - name: farmart-db
    databaseName: farmart_db
    user: farmart_user
    plan: free
